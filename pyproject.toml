[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dograpper"
version = "0.0.0.dev0"
description = "Context engineering pipeline for deterministic LLM ingestion"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pathspec>=1.0.4",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
headless = ["playwright>=1.58.0,<1.66.0"]
build = ["pyinstaller>=6.0"]
httrack = ["brotli>=1.2", "zstandard>=0.22"]
fire-engine = ["curl_cffi>=0.7", "brotli>=1.2", "zstandard>=0.22"]  # curl hands br/zstd bodies over undecoded
dev = [
    "pytest>=7.0",
]
docs = ["sphinx>=8.1", "myst-parser>=4.0", "furo>=2025.12"]

[project.scripts]
dograpper = "dograpper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
